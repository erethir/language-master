<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Master</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="app">
        <!-- Missions Screen -->
        <main id="missions-screen" class="screen active">
            <div class="top-controls">
                <div class="left-controls">
                    <select id="theme-selector" class="theme-select">
                        <option value="theme-yellow">☀️ Sunny Theme</option>
                        <option value="theme-pink">🌸 Pastel Pink</option>
                        <option value="theme-blue">🌌 Deep Blue</option>
                        <option value="theme-neon">⚡ Neon Dark</option>
                        <option value="theme-mafia">🎩 1920s Mafia</option>
                    </select>
                    <button id="reset-btn" class="reset-small-btn">Reset</button>
                </div>
            </div>
            <header>
                <h1>Study Master</h1>
                <p>Select a mission to begin learning!</p>
            </header>
            <div id="missions-grid" class="grid-container">
                <!-- Dynamically populated by JS -->
            </div>
        </main>

        <!-- Topics Screen -->
        <main id="menu-screen" class="screen">
            <div class="quiz-header" style="margin-bottom: 0;">
                <button id="back-to-missions-btn" class="icon-btn">⬅</button>
                <div style="flex: 1;"></div>
                <div class="stats-badge" id="stats-badge">
                    <div class="stats-badge-text">
                        <div class="stars-count">🌟 <span id="total-stars-count">0</span> / <span
                                id="max-stars-count">30</span></div>
                        <div class="achievement-title" id="achievement-title">Recién Llegado</div>
                    </div>
                    <div class="achievement-icon" id="achievement-icon-display">🥚</div>
                </div>
            </div>
            <header style="margin-top: 1rem;">
                <h1 id="mission-title-display">¡Español Master!</h1>
                <p id="mission-desc-display">Select a verb to practice present tense conjugation</p>
            </header>
            <div id="level-grid" class="grid-container">
                <!-- Dynamically populated by JS -->
            </div>
        </main>

        <!-- Quiz Screen -->
        <main id="quiz-screen" class="screen">
            <div class="quiz-header">
                <button id="back-to-menu-btn" class="icon-btn">⬅</button>
                <div class="progress-container">
                    <div id="progress-bar"></div>
                </div>
                <div class="score-display">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"
                        stroke-linecap="round" stroke-linejoin="round" class="star-icon">
                        <polygon
                            points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2">
                        </polygon>
                    </svg>
                    <span id="mistake-counter">Perfect!</span>
                </div>
            </div>

            <div class="question-container">
                <h2 id="verb-display">beber</h2>
                <div class="pronoun-box">
                    <span id="pronoun-display">yo</span>
                    <span class="blank" id="blank-display">_________</span>
                </div>
            </div>

            <div id="options-grid" class="options-container">
                <!-- Buttons injected by JS -->
            </div>

            <div id="free-text-container" class="free-text-container hide">
                <input type="text" id="free-text-input" class="free-text-input" placeholder="Type your answer here..."
                    autocomplete="off">
                <button id="free-text-submit" class="primary-btn submit-btn">Submit</button>
            </div>
        </main>

        <!-- Result Screen -->
        <main id="result-screen" class="screen">
            <div class="result-card">
                <h2>¡Excelente!</h2>
                <div id="result-stars" class="stars-container big-stars">
                    <!-- Stars injected clearly -->
                </div>
                <p id="result-message">You completed the level!</p>

                <div class="action-buttons">
                    <button id="play-again-btn" class="primary-btn">Play Again</button>
                    <button id="map-btn" class="secondary-btn">Back to Topics</button>
                </div>
            </div>
            <!-- Canvas for confetti -->
            <canvas id="confetti" class="confetti-canvas"></canvas>
        </main>

        <!-- Achievement Modal -->
        <div id="achievement-modal" class="modal-overlay hide">
            <div class="modal-content">
                <button id="close-modal-btn" class="close-btn">&times;</button>
                <div class="modal-icon" id="modal-icon">🏆</div>
                <h2>¡Felicidades!</h2>
                <p class="modal-subtitle">New Achievement Unlocked!</p>
                <h3 id="modal-title-es" class="modal-title-es">Español Master</h3>
                <p id="modal-title-en" class="modal-title-en">Spanish Master</p>
            </div>
        </div>
    </div>
    </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
